name: C++ Tests

on:
  push:
    branches: [main]

jobs:
  if: contains(github.event.head_commit.message, '[tests]')

  runs-on: ubuntu-latest

  steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libomp-dev ninja-build

    - name: Compile
      run: cmake --build build --parallel

    - name: Run tests
      run: ctest --test-dir build --output-on-failure